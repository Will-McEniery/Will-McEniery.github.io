{%- assign section = page.url -%}
{%- if page.collection == 'projects' -%}{%- assign section = '/projects.html' -%}{%- endif -%}
{%- if page.collection == 'interests' -%}{%- assign section = '/interests.html' -%}{%- endif -%}
<header class="site-header">
    <nav class="nav" aria-label="Main">
        <a class="nav-brand" href="{{ '/' | relative_url }}"{% if section == '/' %} aria-current="page"{% endif %}>
            <span class="nav-brand-name">{{ site.author.name }}</span>
        </a>

        <button class="nav-menu-button icon-button" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        </button>

        <div class="nav-links" id="nav-links">
            <a href="{{ '/interests.html' | relative_url }}"{% if section == '/interests.html' %} aria-current="page"{% endif %}>Research &amp; Interests</a>
            <a href="{{ '/projects.html' | relative_url }}"{% if section == '/projects.html' %} aria-current="page"{% endif %}>Projects</a>
            <a href="{{ '/cv.html' | relative_url }}"{% if section == '/cv.html' %} aria-current="page"{% endif %}>CV</a>
            <a class="nav-cta" href="{{ '/book.html' | relative_url }}"{% if section == '/book.html' %} aria-current="page"{% endif %}>Book a meeting</a>
            <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme">
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </nav>
</header>
