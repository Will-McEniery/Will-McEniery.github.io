<div class="interactive-widget">
    <canvas id="spin-canvas" width="600" height="400" style="border: 1px solid var(--border); border-radius: 4px;"></canvas>
    
    <div class="controls" style="margin-top: 1rem;">
        <label for="precession-slider">Axis of Precession (θ): <span id="theta-val">45°</span></label>
        <input type="range" id="precession-slider" min="0" max="90" value="45" style="width: 100%;">
    </div>
</div>
